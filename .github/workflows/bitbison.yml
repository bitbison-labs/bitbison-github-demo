name: Bitbison build

# corral's four components, each built and tested in a job of its own under
# Bitbison capture, then the Bitbison gate, then the publish, on master, on
# every pull request and by hand:
#
# - api, web, worker, cli: the build integration's pre hook starts a
#   whole-job capture and its post hook seals and submits it. The four
#   captures are one Bitbison build, a job each. Each job checks out its
#   own component alone, so its capture and its dependencies are that
#   component's;
# - bitbison: waits for the analysis of every job and publishes the build
#   report as a check on the commit and on the job's summary. With
#   gate: agent, a clean build passes without Claude, and Claude decides
#   whether what a flagged build did is a real risk: one fails the job, and
#   the publish does not run;
# - publish: a dry run here, which lists what the gate cleared.
#
# The dependency review is bitbison-review.yml.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    # A pull request from a fork gets no secrets, and its code should not run
    # with them. The same condition is on each build job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: api

      - uses: bitbison-labs/github@e4ef48414f0cf13bd38187afe37669f3853b4ff9 # master
        with:
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}
          instance: ${{ secrets.BITBISON_INSTANCE }}

      - run: cargo test --locked
      - run: cargo build --locked --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corral-api
          path: api/target/release/corral-api

  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # The UI vendors normalize.css as a submodule (web/vendor).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: web
          submodules: true

      - uses: bitbison-labs/github@e4ef48414f0cf13bd38187afe37669f3853b4ff9 # master
        with:
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}
          instance: ${{ secrets.BITBISON_INSTANCE }}

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corral-web
          path: web/dist

  worker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      # The runner's own Python: uv downloads none.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: worker

      - uses: bitbison-labs/github@e4ef48414f0cf13bd38187afe37669f3853b4ff9 # master
        with:
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}
          instance: ${{ secrets.BITBISON_INSTANCE }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - run: uv sync --locked
      - run: uv run --no-sync python -m unittest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corral-worker
          path: |
            worker/report.py
            worker/pyproject.toml
            worker/uv.lock

  cli:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: cli

      - uses: bitbison-labs/github@e4ef48414f0cf13bd38187afe37669f3853b4ff9 # master
        with:
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}
          instance: ${{ secrets.BITBISON_INSTANCE }}

      - run: go test ./...
      - run: go build -trimpath -o corral .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corral-cli
          path: cli/corral

  bitbison:
    needs: [api, web, worker, cli]
    # This demo keeps its reviews apart: a pull request's build is gated on
    # branches named build/..., and every other pull request's conversation
    # is its dependency review alone. In your repository, drop this
    # condition to gate every build.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'build/')
    permissions:
      contents: read
      pull-requests: read
      checks: write
      id-token: write
    uses: bitbison-labs/github/.github/workflows/gate.yml@master
    with:
      gate: agent
    secrets: inherit

  publish:
    needs: [api, web, worker, cli, bitbison]
    # After the gate passed, or where this demo does not gate.
    if: >-
      always() &&
      needs.api.result == 'success' && needs.web.result == 'success' &&
      needs.worker.result == 'success' && needs.cli.result == 'success' &&
      (needs.bitbison.result == 'success' || needs.bitbison.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
      - name: Publish (dry run)
        run: |
          find release -type f | sort | xargs sha256sum
          echo "Published corral (dry run): the build passed the Bitbison gate."
